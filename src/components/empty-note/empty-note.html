<div class="empty-note-frame flex-column">
          <div class="empty-note-frame__graphic-section">
            <img src="src/assets/empty-page-graphic.svg" alt="" class="graphic-section__graphic">
          </div>
          
          <div class="empty-note-frame__text-frame flex-column">
            
            <div class="empty-note-frame__text-section flex-column">
                <p class="empty-note-frame__text">Go to YouTube, copy the link for a video you want to learn from and take some notes.</p>
                <p class="empty-note-frame__text">Paste the link below and click on the upload button to start taking notes.</p>
            </div>
  
            <div class="empty-note-frame__input-section flex-column">
  
              <!-- <label for="input-1">Add a video link from YouTube</label> -->
              <form class="empty-note-frame__input-frame flex-row" id="link-input">
                
                <input id="input-1" class="empty-note-frame__input-text" type="text" placeholder="Example: https://youtu.be/dQw4w9WgXcQ?si=JH8X01fDu3W-UdRA">
                <span class="form-divider"></span>
                <button id="formBtn" form="link-input" type="button"><i class="empty-note-frame__input-btn fa-regular fa-share-from-square"></i></button>
    
              </form>
    
              <div class="empty-note-frame__error"><p id="input-error-text"></p></div>
  
            </div>
  
          </div>
        </div>
